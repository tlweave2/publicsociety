name: Build check

# Pages for this repo is set to "Deploy from a branch" (main), so GitHub's own
# "pages build and deployment" workflow does the publishing — it serves the
# built files committed at the repo root. This workflow does not deploy; it
# verifies the build still compiles and that the committed output is current.
#
# If Pages' Source is ever switched to "GitHub Actions", replace the last two
# steps with actions/configure-pages, actions/upload-pages-artifact (path
# ./out) and actions/deploy-pages, and stop committing the root output.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and copy the export to the repo root
        run: npm run build:site

      - name: Fail if the committed site is out of date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The site committed at the repo root does not match a fresh build."
            echo "Run 'npm run build:site' and commit the result."
            git status --short
            git diff --stat
            exit 1
          fi
          echo "Committed site matches a fresh build."
